# Aagasa production stack, driven by deploy.sh (plan.md V18).
#
#   ./deploy.sh server   # just the control plane on this host
#   ./deploy.sh worker   # just the ground station on this host
#   ./deploy.sh both     # everything on one host
#   ./deploy.sh down     # stop whatever this project is running here
#
# Rootless, by design: Podman runs as the invoking user, nothing binds a port
# below 1024, and every byte of runtime data lives under deployment/ and is bind
# mounted from here (deployment/data, deployment/tls, deployment/web). No sudo anywhere.
#
# Secrets come from deployment/.env (generated by deploy.sh; never committed).
# Images are built from the repository root by deploy.sh; nginx is stock.

name: aagasa

# Named explicitly so deploy.sh can run short-lived jobs (the schema migrator)
# on the same network by name instead of host networking.
networks:
  default:
    name: aagasa

services:
  # Datastores -------------------------------------------------------------
  #
  # Internal only: the Server, the migrator and the backup/restore scripts
  # (which use `podman exec`) reach them over the compose network. Nothing is
  # published to the host.

  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: aagasa-databases-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aagasa
      POSTGRES_USER: aagasa
      POSTGRES_PASSWORD: ${AAGASA_POSTGRES_PASSWORD:?set AAGASA_POSTGRES_PASSWORD in deployment/.env}
      # Keeps the data directory a plain subdirectory, so a host mount with
      # lost+found in it does not stop initdb.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aagasa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: aagasa-databases-redis
    restart: unless-stopped
    # Sessions only, and they are rebuildable by signing in again, so
    # persistence is deliberately off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: docker.io/library/mongo:7
    container_name: aagasa-databases-mongo
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db:z
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Control plane ----------------------------------------------------------

  prediction:
    image: localhost/aagasa-prediction:latest
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deployment/server/Containerfile.prediction
    environment:
      # Bind every interface: the only caller, the Server, reaches it by
      # service name, and it is never published to the host. gRPC rejects an
      # empty host (":9091"), so use the explicit wildcard.
      AAGASA_PREDICTION_ADDRESS: "0.0.0.0:9091"
      AAGASA_LOG_LEVEL: info

  server:
    image: localhost/aagasa-server:latest
    container_name: aagasa-server
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deployment/server/Containerfile
    depends_on:
      - postgres
      - redis
      - mongo
      - prediction
    environment:
      AAGASA_ENV: production
      AAGASA_LOG_LEVEL: ${AAGASA_LOG_LEVEL:-info}
      AAGASA_HTTP_ADDRESS: ":8080"
      AAGASA_GRPC_ADDRESS: ":9090"
      AAGASA_PREDICTION_ADDRESS: "prediction:9091"
      AAGASA_MONGO_DATABASE: aagasa
      AAGASA_RECORDINGS_DIR: /var/lib/aagasa/recordings
      AAGASA_PIPELINES_DIR: /var/lib/aagasa/pipelines
      AAGASA_SESSION_TTL: ${AAGASA_SESSION_TTL:-43200}
      AAGASA_TLE_REFRESH_ENABLED: ${AAGASA_TLE_REFRESH_ENABLED:-true}
      # Both listeners are encrypted when this material is present. The Worker
      # sends its shared secret on every gRPC call, so an unencrypted link
      # would put that credential on the wire (spec.md section 21).
      AAGASA_TLS_CERT_FILE: /etc/aagasa/tls/tls.crt
      AAGASA_TLS_KEY_FILE: /etc/aagasa/tls/tls.key
      # Same-origin through the nginx proxy, so no browser origins are needed:
      # the page and the API share http://<host>:50000.
      AAGASA_ALLOWED_ORIGINS: ""
      AAGASA_POSTGRES_URL: "postgres://aagasa:${AAGASA_POSTGRES_PASSWORD:?set AAGASA_POSTGRES_PASSWORD in deployment/.env}@postgres:5432/aagasa?sslmode=disable"
      AAGASA_REDIS_URL: "redis://redis:6379/0"
      AAGASA_MONGO_URL: "mongodb://mongo:27017"
      AAGASA_WORKER_SHARED_SECRET: ${AAGASA_WORKER_SHARED_SECRET:?set AAGASA_WORKER_SHARED_SECRET in deployment/.env}
    volumes:
      - ./data/recordings:/var/lib/aagasa/recordings:z
      - ./data/pipelines:/var/lib/aagasa/pipelines:z
      - ./tls:/etc/aagasa/tls:ro,z
    ports:
      # Loopback only: deploy.sh polls /readyz here; nothing else needs it.
      - "127.0.0.1:8080:8080"
      # The station host reaches the Server over this on a two-host layout.
      - "9090:9090"

  # Reverse proxy ----------------------------------------------------------
  #
  # Serves the built web client on / and forwards /api (plus health and
  # readiness) to the Server, so the browser talks to one origin and CORS is
  # never involved. deploy.sh copies the built client into deployment/web.

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: aagasa-web
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./web:/usr/share/nginx/html:ro,z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    ports:
      - "50000:50000"

  # Ground station ---------------------------------------------------------

  worker:
    image: localhost/aagasa-worker:latest
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deployment/worker/Containerfile
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/bus/usb:/dev/bus/usb"
    environment:
      AAGASA_LOG_LEVEL: ${AAGASA_LOG_LEVEL:-info}
      # The Server resolves the identifiers from this name.
      AAGASA_WORKER_NAME: ${AAGASA_WORKER_NAME:-worker-1}
      # Inside a compose project this resolves to the Server service; on a
      # dedicated station host deploy.sh sets it to the Server's real address.
      AAGASA_SERVER_GRPC_ADDRESS: ${AAGASA_SERVER_GRPC_ADDRESS:-server:9090}
      AAGASA_SERVER_TLS_ENABLED: "true"
      AAGASA_STATE_DIR: /var/lib/aagasa/state
      # The Worker records into its own local staging area and uploads the
      # content over gRPC; the Server keeps the authoritative store in its own
      # recordings directory. Keeping them separate means a single-host
      # deployment is not two processes writing the same path.
      AAGASA_RECORDINGS_DIR: /var/lib/aagasa/worker-recordings
      AAGASA_ROTATOR_SERIAL_PORT: ${AAGASA_ROTATOR_SERIAL_PORT:-/dev/ttyUSB0}
      AAGASA_ROTATOR_BAUD_RATE: ${AAGASA_ROTATOR_BAUD_RATE:-9600}
      AAGASA_ROTATOR_PARK_AZIMUTH: ${AAGASA_ROTATOR_PARK_AZIMUTH:-0}
      AAGASA_ROTATOR_PARK_ELEVATION: ${AAGASA_ROTATOR_PARK_ELEVATION:-0}
      AAGASA_SDR_DEVICE_INDEX: ${AAGASA_SDR_DEVICE_INDEX:-0}
      AAGASA_SATDUMP_BIN: satdump
      AAGASA_HEARTBEAT_INTERVAL_SECONDS: ${AAGASA_HEARTBEAT_INTERVAL_SECONDS:-5}
      AAGASA_WORKER_SHARED_SECRET: ${AAGASA_WORKER_SHARED_SECRET:?set AAGASA_WORKER_SHARED_SECRET in deployment/.env}
      # ssl_channel_credentials() trusts the default roots; the Server uses a
      # self-signed certificate, so point gRPC at that certificate instead.
      GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: /etc/aagasa/tls/tls.crt
    volumes:
      - ./data/state:/var/lib/aagasa/state:z
      - ./data/worker-recordings:/var/lib/aagasa/worker-recordings:z
      - ./tls:/etc/aagasa/tls:ro,z

