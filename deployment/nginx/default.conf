# Aagasa nginx: serves the built web client and forwards the API to the Server
# on the same origin, so the browser never triggers CORS.
#
# Reasoned out for now: plain HTTP on 50000. Bring TLS in here later; the
# Server's own listeners stay encrypted regardless (deploy/README.md).

server {
    listen 50000;

    root /usr/share/nginx/html;
    index index.html;

    # The Server keeps TLS on for both its listeners; the upstream here is the
    # loopback-facing host mount of the Server's own self-signed certificate,
    # so verification is switched off for that hop only.
    location /api/ {
        proxy_pass https://server:8080;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass https://server:8080;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass https://server:8080;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
