apiVersion: v1
kind: Pod
metadata:
  name: aagasa-worker
  labels:
    app: aagasa-worker
spec:
  containers:
    - name: worker
      image: localhost/aagasa-worker:latest
      env:
        - name: AAGASA_LOG_LEVEL
          value: "${AAGASA_LOG_LEVEL}"
        - name: AAGASA_WORKER_NAME
          value: "${AAGASA_WORKER_NAME}"
        - name: AAGASA_SERVER_GRPC_ADDRESS
          value: "${AAGASA_SERVER_GRPC_ADDRESS}"
        - name: AAGASA_SERVER_TLS_ENABLED
          value: "${AAGASA_SERVER_TLS_ENABLED}"
        - name: AAGASA_STATE_DIR
          value: "${AAGASA_STATE_DIR}"
        - name: AAGASA_RECORDINGS_DIR
          value: "${AAGASA_RECORDINGS_DIR}"
        - name: AAGASA_ROTATOR_SERIAL_PORT
          value: "${AAGASA_ROTATOR_SERIAL_PORT}"
        - name: AAGASA_ROTATOR_BAUD_RATE
          value: "${AAGASA_ROTATOR_BAUD_RATE}"
        - name: AAGASA_ROTATOR_PARK_AZIMUTH
          value: "${AAGASA_ROTATOR_PARK_AZIMUTH}"
        - name: AAGASA_ROTATOR_PARK_ELEVATION
          value: "${AAGASA_ROTATOR_PARK_ELEVATION}"
        - name: AAGASA_SDR_DEVICE_INDEX
          value: "${AAGASA_SDR_DEVICE_INDEX}"
        - name: AAGASA_RTL_TEST_BIN
          value: "${AAGASA_RTL_TEST_BIN}"
        - name: AAGASA_SATDUMP_BIN
          value: "${AAGASA_SATDUMP_BIN}"
        - name: AAGASA_SATDUMP_PIPELINES_DIR
          value: "${AAGASA_SATDUMP_PIPELINES_DIR}"
        - name: AAGASA_SATDUMP_LEGACY_CLI
          value: "${AAGASA_SATDUMP_LEGACY_CLI}"
        - name: AAGASA_HEARTBEAT_INTERVAL_SECONDS
          value: "${AAGASA_HEARTBEAT_INTERVAL_SECONDS}"
        - name: AAGASA_WORKER_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: aagasa-worker-shared-secret
              key: value
      securityContext:
        privileged: true
      volumeMounts:
        - name: state
          mountPath: /var/lib/aagasa/state
        - name: recordings
          mountPath: /var/lib/aagasa/recordings
        - name: rotator
          mountPath: /dev/ttyUSB0
        - name: usb
          mountPath: /dev/bus/usb

  volumes:
    - name: state
      hostPath:
        path: /var/lib/aagasa/state
        type: DirectoryOrCreate
    - name: recordings
      hostPath:
        path: /var/lib/aagasa/recordings
        type: DirectoryOrCreate
    - name: rotator
      hostPath:
        path: /dev/ttyUSB0
        type: CharDevice
    - name: usb
      hostPath:
        path: /dev/bus/usb
        type: Directory
