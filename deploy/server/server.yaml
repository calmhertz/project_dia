# Aagasa Server pod. Install to /etc/containers/systemd/ with server.kube.
# Secrets come from the "aagasa-server" Podman secret set, never from this file.
# This file supports environment variable substitution via envsubst.
apiVersion: v1
kind: Pod
metadata:
  name: aagasa-server
  labels:
    app: aagasa-server
spec:
  # Network mode: host for rootful, bridge for rootless (controlled by AAGASA_HOST_NETWORK)
  hostNetwork: ${AAGASA_HOST_NETWORK:-true}

  containers:
    - name: prediction
      image: localhost/aagasa-prediction:latest
      env:
        - name: AAGASA_PREDICTION_ADDRESS
          value: "${AAGASA_PREDICTION_ADDRESS}"
        - name: AAGASA_LOG_LEVEL
          value: "${AAGASA_LOG_LEVEL}"

    - name: server
      image: localhost/aagasa-server:latest
      env:
        - name: AAGASA_ENV
          value: "${AAGASA_ENV}"
        - name: AAGASA_LOG_LEVEL
          value: "${AAGASA_LOG_LEVEL}"
        - name: AAGASA_HTTP_ADDRESS
          value: "${AAGASA_HTTP_ADDRESS}"
        - name: AAGASA_GRPC_ADDRESS
          value: "${AAGASA_GRPC_ADDRESS}"
        - name: AAGASA_PREDICTION_ADDRESS
          value: "${AAGASA_PREDICTION_ADDRESS}"
        - name: AAGASA_MONGO_DATABASE
          value: "${AAGASA_MONGO_DATABASE}"
        - name: AAGASA_RECORDINGS_DIR
          value: "${AAGASA_RECORDINGS_DIR}"
        - name: AAGASA_PIPELINES_DIR
          value: "${AAGASA_PIPELINES_DIR}"
        - name: AAGASA_SESSION_TTL
          value: "${AAGASA_SESSION_TTL}"
        - name: AAGASA_TLE_REFRESH_ENABLED
          value: "${AAGASA_TLE_REFRESH_ENABLED}"
        # Both listeners are encrypted when this material is present. The
        # Worker sends its shared secret on every gRPC call, so an unencrypted
        # link would put that credential on the wire.
        - name: AAGASA_TLS_CERT_FILE
          value: "${AAGASA_TLS_CERT_FILE}"
        - name: AAGASA_TLS_KEY_FILE
          value: "${AAGASA_TLS_KEY_FILE}"
        # Origins the browser client is served from. Without this the browser
        # blocks every call it makes.
        - name: AAGASA_ALLOWED_ORIGINS
          value: "${AAGASA_ALLOWED_ORIGINS}"

        - name: AAGASA_POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: aagasa-postgres-url
              key: value
        - name: AAGASA_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: aagasa-redis-url
              key: value
        - name: AAGASA_MONGO_URL
          valueFrom:
            secretKeyRef:
              name: aagasa-mongo-url
              key: value
        - name: AAGASA_WORKER_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: aagasa-worker-shared-secret
              key: value
      # Port mappings only used in bridge mode (rootless)
      ports:
        - containerPort: 8080
          hostPort: 8080
        - containerPort: 9090
          hostPort: 9090
      volumeMounts:
        - name: recordings
          mountPath: /var/lib/aagasa/recordings
        - name: pipelines
          mountPath: /var/lib/aagasa/pipelines
        - name: tls
          mountPath: /etc/aagasa/tls
          readOnly: true
      # scheme: HTTPS because the listener is encrypted; the probe would
      # otherwise speak plaintext to a TLS port and report a healthy service
      # as dead.
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
          scheme: HTTPS
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
          scheme: HTTPS
        periodSeconds: 10

  volumes:
    - name: recordings
      hostPath:
        path: ${AAGASA_RECORDINGS_DIR}
        type: DirectoryOrCreate
    - name: pipelines
      hostPath:
        path: ${AAGASA_PIPELINES_DIR}
        type: DirectoryOrCreate
    # Certificate and key, owner-readable only. Renewing them means replacing
    # these files and restarting the service.
    - name: tls
      hostPath:
        path: ${AAGASA_TLS_DIR}
        type: Directory
