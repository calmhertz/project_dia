apiVersion: v1
kind: Pod
metadata:
  name: aagasa-databases
  labels:
    app: aagasa-databases
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: "aagasa"
        - name: POSTGRES_USER
          value: "aagasa"
        - name: POSTGRES_PASSWORD
          value: "fb874ba79b2e400bfa8e8443e989fbdfc73d872bcb02eae8"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
      ports:
        - containerPort: 5432
          hostPort: 5432
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "aagasa"]
        periodSeconds: 30

    - name: redis
      image: docker.io/library/redis:7-alpine
      args: ["redis-server", "--save", "", "--appendonly", "no"]
      ports:
        - containerPort: 6379
          hostPort: 6379
          hostIP: "127.0.0.1"
      livenessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 30

    - name: mongo
      image: docker.io/library/mongo:7
      ports:
        - containerPort: 27017
          hostPort: 27017
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      livenessProbe:
        exec:
          command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
        periodSeconds: 30

  volumes:
    - name: postgres-data
      hostPath:
        path: /var/lib/aagasa/postgres
        type: DirectoryOrCreate
    - name: mongo-data
      hostPath:
        path: /var/lib/aagasa/mongo
        type: DirectoryOrCreate
