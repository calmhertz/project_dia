apiVersion: v1
kind: Pod
metadata:
  name: aagasa-databases
  labels:
    app: aagasa-databases
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/library/postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: "aagasa"
        - name: POSTGRES_USER
          value: "aagasa"
        - name: POSTGRES_PASSWORD
          value: "__POSTGRES_PASSWORD__"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
      ports:
        - containerPort: 5432
          hostPort: 5432
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "aagasa"]
        periodSeconds: 30

    - name: redis
      image: docker.io/library/redis:7-alpine
      args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
      ports:
        - containerPort: 6379
          hostPort: 6379
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: redis-data
          mountPath: /data
      livenessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 30

    - name: mongo
      # MongoDB 7 requires ARMv8.2-A; 4.4 runs on baseline ARMv8 (e.g. Raspberry
      # Pi 4 / older SBCs) and still supports everything the server uses.
      image: docker.io/library/mongo:4.4.18
      ports:
        - containerPort: 27017
          hostPort: 27017
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      livenessProbe:
        exec:
          command: ["mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
        periodSeconds: 30

  volumes:
    - name: redis-data
      hostPath:
        path: /var/lib/aagasa/redis
        type: DirectoryOrCreate
    - name: postgres-data
      hostPath:
        path: /var/lib/aagasa/postgres
        type: DirectoryOrCreate
    - name: mongo-data
      hostPath:
        path: /var/lib/aagasa/mongo
        type: DirectoryOrCreate
