apiVersion: v1
kind: Pod
metadata:
  name: aagasa-db
  labels:
    app: aagasa-db
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/library/postgres:19-alpine
      env:
        - name: POSTGRES_DB
          value: "aagasa"
        - name: POSTGRES_USER
          value: "aagasa"
        - name: POSTGRES_PASSWORD
          value: "__POSTGRES_PASSWORD__"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
      ports:
        - containerPort: 5432
          hostPort: 5432
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
    - name: redis
      image: docker.io/library/redis:8-alpine
      args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
      ports:
        - containerPort: 6379
          hostPort: 6379
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: redis-data
          mountPath: /data
    - name: mongo
      image: docker.io/library/mongo:4.4.18
      ports:
        - containerPort: 27017
          hostPort: 27017
          hostIP: "127.0.0.1"
      volumeMounts:
        - name: mongo-data
          mountPath: /data/db
  volumes:
    - name: redis-data
      hostPath:
        path: /var/lib/aagasa/redis
        type: DirectoryOrCreate
    - name: postgres-data
      hostPath:
        path: /var/lib/aagasa/postgres
        type: DirectoryOrCreate
    - name: mongo-data
      hostPath:
        path: /var/lib/aagasa/mongo
        type: DirectoryOrCreate
